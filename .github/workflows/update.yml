name: 予想の自動更新
on:
  schedule:
    # GitHubの定期実行は混雑時に遅れたり飛ばされたりするため、回数を多めにし、混みやすい「0分ちょうど」を避けている
    - cron: "7 9 * * 4,5"              # 木・金 18:07（日本時間）週末の出馬表・前日オッズ
    - cron: "37 11 * * 4,5"            # 木・金 20:37 取りこぼし対策
    - cron: "17 22 * * 5,6,0"          # 土・日・月 7:17 朝の馬場発表前の最新オッズ
    - cron: "7,22,37,52 0-8 * * 6,0,1" # 土・日・月 9:07〜17:52 の15分ごと：オッズ・馬体重・結果・当日の馬場傾向
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 過去の払戻金が足りなければ補う（そろったら何もしない）
        run: |
          need=$(python -c "
          import os, pandas as pd
          e = pd.read_csv('data/csv/entries.csv', dtype={'race_id': str}); m = set(e[e.finish.notna()].race_id.str[:10])
          p = set(pd.read_csv('data/csv/payouts.csv', dtype={'race_id': str}).race_id.str[:10]) if os.path.exists('data/csv/payouts.csv') else set()
          print(1 if len(m - p) > 5 else 0)" 2>/dev/null || echo 0)
          if [ "$need" = "1" ]; then python scraper/backfill.py 2024-11 60 || true; fi
      - name: 公式サイトから最新情報を取得
        run: python scraper/update.py
      - name: 予想を計算（過去データが十分にそろってから）
        run: |
          n=$(python -c "import pandas as pd; e=pd.read_csv('data/csv/entries.csv'); print(e[e.finish.notna()].race_id.nunique())" 2>/dev/null || echo 0)
          echo "保存済みレース数: $n"
          if [ "$n" -ge 1500 ]; then
            python pipeline/model.py data/csv/ data/app_data.json
            python pipeline/log_predictions.py
            python pipeline/analyze.py
            python pipeline/export.py
          else
            echo "過去データがまだ少ないため、予想の計算はスキップします"
          fi
      - name: 保存して公開
        run: |
          git config user.name "keiba-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data docs
          git commit -m "update: $(TZ=Asia/Tokyo date '+%m/%d %H:%M')" || echo "no changes"
          git pull --rebase -X ours || true
          git push
