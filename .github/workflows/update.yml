name: 予想の自動更新
on:
  schedule:
    - cron: "0 9 * * 4,5"        # 木・金 18:00（日本時間）週末の出馬表・前日オッズ
    - cron: "*/30 0-8 * * 6,0,1" # 土・日・月 9:00〜17:30 の30分ごと：オッズ・馬体重・結果・当日の馬場傾向
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 公式サイトから最新情報を取得
        run: python scraper/update.py
      - name: 予想を計算（過去データが十分にそろってから）
        run: |
          n=$(python -c "import pandas as pd; e=pd.read_csv('data/csv/entries.csv'); print(e[e.finish.notna()].race_id.nunique())" 2>/dev/null || echo 0)
          echo "保存済みレース数: $n"
          if [ "$n" -ge 1500 ]; then
            python pipeline/model.py data/csv/ data/app_data.json
            python pipeline/export.py
          else
            echo "過去データがまだ少ないため、予想の計算はスキップします"
          fi
      - name: 保存して公開
        run: |
          git config user.name "keiba-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/csv docs/data.json
          git commit -m "update: $(TZ=Asia/Tokyo date '+%m/%d %H:%M')" || echo "no changes"
          git push
