name: 公式サイトの構造調査（手動）
on:
  workflow_dispatch:
    inputs:
      script:
        description: 実行する調査スクリプト
        default: probe.py
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scraper/${{ inputs.script }}
      - name: 調査結果を保存
        run: |
          git config user.name "keiba-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add probe
          git commit -m "probe: 公式サイトのページ構造を保存" || echo "no changes"
          git push
