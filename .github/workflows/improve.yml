name: 毎週の自動改善
on:
  schedule:
    - cron: "0 15 * * 2"   # 毎週水曜 0:00（日本時間）：週末のレースを振り返って設定を見直す
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 設定を変えたモデルを比較して、最良のものを採用
        run: python pipeline/improve.py
      - name: 保存
        run: |
          git config user.name "keiba-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A config data
          git commit -m "improve: $(TZ=Asia/Tokyo date '+%m/%d')" || echo "no changes"
          git pull --rebase -X ours || true
          git push
      - name: 新しい設定で予想を作り直す
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml -R "${{ github.repository }}"
