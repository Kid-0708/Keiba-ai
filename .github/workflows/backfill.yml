name: 過去データの取得（手動）
on:
  workflow_dispatch:
    inputs:
      since:
        description: どの年月までさかのぼるか（例 2024-11）
        default: "2024-11"
      minutes:
        description: 最大実行時間（分）
        default: "320"
permissions:
  contents: write
  actions: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 過去のレース結果を取得
        id: run
        run: |
          set +e
          python scraper/backfill.py "${{ inputs.since }}" "${{ inputs.minutes }}"
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: 保存
        if: always()
        run: |
          git config user.name "keiba-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/csv
          git commit -m "backfill: $(TZ=Asia/Tokyo date '+%m/%d %H:%M')" || echo "no changes"
          git pull --rebase -X ours || true
          git push
      - name: 時間切れなら続きを自動で再開
        if: steps.run.outputs.code == '3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run backfill.yml -R "${{ github.repository }}" -f since="${{ inputs.since }}" -f minutes="${{ inputs.minutes }}"
